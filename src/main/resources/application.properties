spring.application.name=Huerto
server.port=${PORT:8080}
server.address=0.0.0.0

# MySQL: crear primero la base huerto_escolar con database/huerto_escolar.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huerto_escolar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA crea y actualiza las tablas a partir de las entidades al iniciar la aplicación.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload-dir=${UPLOAD_DIR:uploads}
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.security.token-expiration-hours=${TOKEN_EXPIRATION_HOURS:24}
